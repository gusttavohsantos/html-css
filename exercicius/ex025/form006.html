<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>

    <style>

        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        fieldset{
            background-color: lightgray;
        }
    legend{
        background-color: black;
        color: white;
        border-radius: 5px;
        padding: 5px;
    }

    </style>

</head>
<body>
    <h1>Testando Formulários</h1>
<fieldset style="border-radius: 10px; border-color: black;">
        <legend>dados de pesquisa</legend>
        
        <form action="cadastro.php" method="post" autocomplete="on">
            <p>
                <label for="icor">Cor:</label>
                <input type="color" name="cor" id="icor" value="black">
            </p>
            <p>
                <label for="inivel">Nível de satisfação</label>
                <input type="range" name="nivel" id="inivel" min="1" max="10" value="2">
            </p>
            <p>
                <label for="ifoto">Foto de perfil</label>
                <input type="file" name="foto" id="ifoto">
            </p>
</fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Excluir">
        </p>
    </form>
</body>
</html>
