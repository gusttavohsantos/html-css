<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="inunber1">Número 1:</label>
            <input type="number" name="number1" id="inumber1" min="0" max="50" required oninput="isoma.innerHTML = Number(inumber1.value) + Number(inumber2.value)">
        </p>
        <p>
            <label for="inumber2">Número 2:</label>
            <input type="number" name="number2" id="inumber2" min="0" max="50" required  oninput="isoma.innerHTML = Number(inumber1.value) + Number(inumber2.value)">
        </p>

        <p>
            <label for="isoma">Soma:</label>
            <output name="soma" id="isoma">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Excluir">
        </p>
    </form>
</body>
</html>
