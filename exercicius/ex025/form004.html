<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
<h1>Testando Formulários</h1>

<form action="cadastro.php" method="post" autocomplete="on">
    <fieldset>
        <legend>Dados Pessoais</legend>
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30" autocomplete="name" placeholder="Nome Completo" >
        </p>

        <p>
            <label for="iemail">Email</label>
            <input type="email" name="email" id="iemail" placeholder="Name@gmail.com" autocomplete="email" required pattern="^.+@gmail\.com$">
        </p>
        
        <p>
            <label for="itel">Telefone</label>
            <input type="tel" name="tel" id="itel" placeholder="(xx) xxxx-xxxx" autocomplete="tel" pattern="^\([0-9]{2}\)[0-9]{4,5}-[0-9]{4}$" required>
        </p>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Excluir">
        </p>
    

</form>

</body>
</html>
