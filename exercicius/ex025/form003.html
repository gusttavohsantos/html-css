 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
 </head>
 <body>
    <h1 style="text-align: center;">Testando Formulários</h1>
    <hr>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" minlength="10" maxlength="30" required placeholder="Nome completo" autocomplete="name">
        </p>

        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" required placeholder="Média" step="0.1" min="0" max="10" value="0" autocomplete="cc-number">
        </p>

        <p>
            <label for="imes">Período Letivo</label>
            <input type="month" name="mes" id="imes" required value="2026-10">
        </p>

        <p>
            <label for="idia">Dia  da prova</label>
            <input type="date" name="dia" id="idia" required value="2026-10-01">
        </p>

        <p>
            <label for="ihora">Hora da  prova</label>
            <input type="time" name="hora" id="ihora" value="00:00">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Apagar">
        </p>

    </form>
 </body>
 </html>
