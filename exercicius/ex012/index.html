<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video src="midia/meu-video.webm.webm" width="500" controls></video>
    <!--Está é a maneira mais simples de se colocar um vídeo em um site, pois o navegador do seu cliente não pode ssre compatível com o tipo de arquivo.-->
    <p>Sendo essa a melho maneira</p>
    <video width="500" poster="imagem/imagem paisagem600.jpg" controls loop muted autoplay>

       <source src="midia/meu-video.m4v.mp4" type="video/mp4">
       <source src="midia/meu-video.mp4.mp4" type="video/mp4">
       <source src="midia/meu-video.webm.webm" type="video/webm">
       <p>seu navegador não é compatível com a reprodução de vídeos.</p>

    </video>
    <!--Essa estrutura pode deixar o site caro para o bolso do cliente e ocupando muitos arquivos-->
    <!--O autoplay só funciona em vídeos mudos e é preciso colocar MUTED antes do AUTOPLAY.-->
    <h1>Inserindo vídeos do youtube</h1>
    <iframe width="500" height="315" src="https://www.youtube.com/embed/8Np_Xh4-8XU?si=9mRZ7zwB-el12-MK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h1>também posso inserir vídeos do vimeo</h1>
    <iframe src="https://player.vimeo.com/video/423776817?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" width="600" height="338" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="&quot;Kitbull&quot; animation reel"></iframe>
    <!--Usar i vimeo para hospedar vídeos para que eles fiquem privados.-->

    
</body>
</html>
