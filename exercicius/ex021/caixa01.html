<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelo de caixa</title>
    <link rel="shortcut icon" href="imagens/icone-instagram.png" type="image/x-icon">
    <style>
        h1{
            background-color: lightgray;
            width: 300px;
            height: 300px;
            border-width: 10px;
            border-style: solid;
            border-color:darkslategray;

            outline-width: 5px;
            outline-style: dashed;
            outline-color: blue;
        }

        a{
            border: 10px solid red;
            padding: 10px;
        }

        /*para configurar o padding é recomendado fazer em sentido horário*/
    </style>
</head>
<body>
    <h1>exemplo de caixa box-level</h1>
    <p>parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona</p>
   
</body>
</html>
