<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>

    <style>

        a{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            text-decoration: none;
            color: red;
            
        }

        a:hover{
            color: red;
            text-decoration: underline;
        }

        a:active{
            color: yellow;
            
        }

        a:visited{
            color: darkred;
        }

        .especial{
            background-color: rgba(213, 45, 45, 0.505);
            width: 300px;
        }

       

       

        /* :: é usasdo nos pseudo elementos ou seja coloca elementos antes e depois do conteúdo
        */






    </style>
</head>
<body>

    <h1>personalizando links</h1>

    <ul>
        <a href="https://www.cursoemvideo.com" target="_blank">
            <li>site curso em vídeo</li>
        </a>
        <a href="https://gustavoguanabara.guithub.io" target="_blank">
            <li>repositório guithub</li>
        </a>
        <a href="https://youtube.com/cursoemvideo/" target="_blank">
            <li class="especial">canal gustavo guanabara</li>
        </a>
    </ul>

    
    
</body>
</html>
