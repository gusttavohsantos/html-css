<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo classes</title>
    <link rel="shortcut icon" href="imagens/icone-instagram.png" type="image/x-icon">

    <style>
        div{
            background-color: rebeccapurple;
            text-align: center;
            width: 200px;
            height: 200px;
            border: 2px solid black;
            display: inline-block;
        }

        div:hover{
            background-color: black;
            color: white;
        }

        




    </style>
</head>
<body>
    <div id="d1">1</div>
    <div id="d2">2</div>
    <div id="d3">3</div>
</body>
</html>
