<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>

    <style>

        *{
            font-family: Arial, Helvetica, sans-serif;
        }


        table{
            border-collapse: collapse;
            width: 500px;
            margin: auto;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
        }

        th{
            background-color: gray;
            color: white;
        }

        th.media{
            text-align: left;
        }

        td.nota{
            text-align: center;
        }

        td#media{
            background-color: gray;
            color: white;
        }

       
    </style>

</head>
<body>

                <th colspan="2" rowspan="2" scope="col">Área</th>

                <th colspan="2" scope="colgroup
                ">Notas</th>
                
                <th colspan="2" rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col">nota 1</th>
                <th scope="col">nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" colspan="2" scope="rowgroup">Exatas</th>
                <td colspan="2">Matemática</td>
                <td class="nota">00</td>

                <td class="nota">00</td>
            </tr>
            <tr>
                <td colspan="2">Física</td>
                <td class="nota">00</td>

                <td class="nota">00</td>
            </tr>
            <tr>

                <td class="nota">00</td>

                <td class="nota">00</td>
            </tr>
            <tr>
                <td colspan="2">Biologia</td>
                <td class="nota">00</td>
                <td class="nota">00</td>
                <td class="nota">00</td>
            </tr>
            <tr>
                <th colspan="6" class="media" scope="row">Média de Exatas</th>
                <td class="nota" id="media">00</td>
            </tr>
            <tr>
                <th colspan="2" rowspan="2" scope="rowgroup">Humanas</th>
                <td colspan="2">História</td>
                <td class="nota">00</td>
                <td class="nota">00</td>

            </tr>
            <tr>
                <td colspan="2">Geografia</td>
                <td class="nota">00</td>

                <td class="nota">00</td>
            </tr>
            <tr>
                <th colspan="6" class="media" scope="row">Média de Humanas</th>
                <td class="nota" id="media">00</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
